[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-performance-mode"
version = "0.1.0"
description = "Waybar power-mode controller for Ryzen/Radeon on MangoWM (Eco/Balanced/Max)"
readme = "README.md"
authors = [{ name = "qwerpik", email = "qwerpik@users.noreply.github.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
keywords = ["waybar", "mangowm", "power", "ryzen", "radeon", "linux", "wayland"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
lint = ["ruff>=0.4.0", "mypy>=1.10.0"]
build = ["build>=1.0.0", "twine>=5.0.0"]

[project.scripts]
mango-performance-mode = "mango_performance_modes.controller:main"

[project.urls]
Homepage = "https://github.com/qwerpik/mango-performance-mode"
Repository = "https://github.com/qwerpik/mango-performance-mode.git"
Issues = "https://github.com/qwerpik/mango-performance-mode/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
